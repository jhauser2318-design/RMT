<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="RMT logo">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#0f5a2c"/>
      <stop offset="0.6" stop-color="#062a15"/>
      <stop offset="1" stop-color="#021208"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8ff5c"/>
      <stop offset="0.5" stop-color="#22e06b"/>
      <stop offset="1" stop-color="#0a8f3e"/>
    </linearGradient>
    <linearGradient id="ball" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2cf27c"/>
      <stop offset="1" stop-color="#0b9a45"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9ff7a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- coin -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#ring)" stroke-width="16"/>
  <circle cx="256" cy="256" r="204" fill="none" stroke="#22e06b" stroke-opacity="0.35" stroke-width="5" stroke-dasharray="3 13"/>

  <!-- football -->
  <g transform="rotate(-38 256 262)">
    <path d="M86 262 C 150 150, 362 150, 426 262 C 362 374, 150 374, 86 262 Z" fill="url(#ball)" stroke="#021208" stroke-width="10"/>
    <path d="M128 222 C 140 236, 140 288, 128 302" fill="none" stroke="#021208" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round"/>
    <path d="M384 222 C 372 236, 372 288, 384 302" fill="none" stroke="#021208" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- rising chart line = the laces -->
  <g filter="url(#glow)">
    <polyline points="132,352 200,300 238,326 300,248 338,270 392,186" fill="none" stroke="url(#arrow)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M352 168 L 420 152 L 404 220 Z" fill="#d9ff7a" stroke="#d9ff7a" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <!-- dollar mark -->
  <g transform="translate(166 150)">
    <circle r="40" fill="#021208" stroke="url(#ring)" stroke-width="7"/>
    <text y="17" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="50" fill="#b8ff5c">$</text>
  </g>
</svg>
