# Runs RMT's tests on every change, so a broken update never reaches the PC.
name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tests/test_parsers.py
      - run: python tests/test_stream.py
      - run: python tests/test_alpaca.py
